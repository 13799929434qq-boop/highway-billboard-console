<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>沿途 · 高速公路广告牌经营管理系统</title>
<style>
:root{--ink:#163c39;--muted:#6d7f79;--paper:#f4f5ef;--green:#24594d;--line:#d8dfd6;--yellow:#e2b45c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}button,input{font:inherit}button,a,input{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b98737;outline-offset:5px}.page{min-height:100svh;display:grid;grid-template-columns:57% 43%}.landscape{position:relative;overflow:hidden;background:#cbd9c6;min-height:760px}.brand{position:absolute;top:43px;left:48px;z-index:2;display:flex;align-items:center;gap:13px}.symbol{width:38px;height:38px}.brand-name{font-size:25px;font-weight:700;letter-spacing:5px}.brand small{display:block;font-size:10px;letter-spacing:2px;margin-top:4px}.edition{position:absolute;right:40px;top:54px;font-size:11px;letter-spacing:2px;opacity:.7}.scene{position:absolute;width:100%;height:100%;inset:0}.story{position:absolute;left:9%;top:20%;z-index:1}.story .caption{font-size:12px;letter-spacing:4px;display:flex;align-items:center;gap:12px}.caption:before{content:"";width:30px;height:1px;background:var(--ink)}h1{font-family:"STSong","SimSun",serif;font-size:clamp(40px,4.4vw,70px);font-weight:400;line-height:1.35;letter-spacing:5px;margin:24px 0 20px}.story p{font-size:13px;line-height:2;letter-spacing:1px;opacity:.75}.land-bottom{position:absolute;bottom:37px;left:48px;right:42px;color:#f5f5dd;display:flex;justify-content:space-between;align-items:end;font-size:11px;letter-spacing:2px}.land-bottom span{display:block;margin-top:8px;font-size:10px;opacity:.65}.location{border-left:1px solid #a8baaa;padding-left:17px;line-height:1.8}.login-side{display:flex;flex-direction:column;padding:46px 11% 28px;position:relative}.topline{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap}.secure{display:flex;align-items:center;gap:6px}.secure svg{width:14px;height:14px}main{width:100%;max-width:370px;margin:auto; padding:65px 0}.eyebrow{color:#879188;letter-spacing:3px;font-size:10px;margin-bottom:18px}h2{font-size:30px;font-weight:500;letter-spacing:2px;margin:0 0 12px}.intro{font-size:13px;color:var(--muted);line-height:1.9;margin:0 0 37px}.tab{font-size:14px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:27px;position:relative}.tab:after{content:"";position:absolute;bottom:-1px;left:0;width:56px;height:2px;background:var(--green)}label.field-label{font-size:12px;display:block;margin:21px 0 10px}.input-wrap{height:51px;display:flex;align-items:center;border:1px solid #ccd5cc;background:#fafbf7;border-radius:4px;transition:.2s}.input-wrap:focus-within{border-color:var(--green);box-shadow:0 0 0 3px #24594d12}.input-wrap>svg{width:18px;height:18px;margin-left:15px;stroke:#809088;flex-shrink:0}input[type=text],input[type=password]{width:100%;min-width:0;border:0;background:transparent;outline:0;padding:15px 12px;color:var(--ink);font-size:13px}input::placeholder{color:#a1aaa0}.eye{border:0;background:none;padding:12px;color:#7b8a80;display:flex}.eye svg{width:18px;height:18px}.options{display:flex;justify-content:space-between;align-items:center;margin:19px 0 27px;font-size:12px}.remember{display:flex;align-items:center;gap:7px;color:#6b7c72;cursor:pointer}input[type=checkbox]{accent-color:var(--green);width:14px;height:14px;margin:0}.text-button{border:0;background:none;color:var(--green);font-size:12px;padding:4px 0}.submit{width:100%;border:0;border-radius:4px;height:51px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 21px;font-size:14px;letter-spacing:3px;transition:background .2s}.submit:hover{background:#163f35}.submit:disabled{opacity:.65;cursor:wait}.submit span:last-child{font-size:22px;font-weight:300}.notice{font-size:11px;color:#8b968b;line-height:1.9;margin:19px 0 0}.message{font-size:12px;line-height:1.8;color:#9c4b35;min-height:23px;margin-top:12px}.footer{border-top:1px solid var(--line);padding-top:19px;display:flex;justify-content:space-between;font-size:10px;color:#95a094;gap:10px}.footer button{font-size:10px;color:#6b7c72;border:0;padding:0;background:none}dialog{border:1px solid var(--line);border-radius:8px;max-width:420px;width:calc(100% - 40px);padding:30px;background:var(--paper);color:var(--ink);box-shadow:0 20px 80px #183a3930}dialog::backdrop{background:#173b3955;backdrop-filter:blur(5px)}dialog h3{margin:0 0 14px;font-size:20px;font-weight:500}dialog p{font-size:13px;color:var(--muted);line-height:2;margin-bottom:24px}dialog .submit{justify-content:center}.demo-tag{font-size:10px;border:1px solid #cbd4c9;padding:4px 7px;border-radius:3px;color:#7a897c}@media(min-width:1600px){.login-side{padding-left:14%;padding-right:14%}}@media(max-width:1000px){.page{grid-template-columns:48% 52%}.brand{left:28px}.edition{display:none}.land-bottom{left:28px;right:25px}.location{display:none}.story{left:9%;top:23%}.story h1{font-size:44px}.login-side{padding-left:10%;padding-right:10%}}@media(max-width:700px){.page{display:block}.landscape{min-height:250px;height:30svh;max-height:330px}.brand{top:22px;left:25px}.brand-name{font-size:20px}.brand small{font-size:8px}.symbol{width:30px}.story{top:100px;left:25px}.story h1{font-size:30px;margin:0;letter-spacing:3px}.story h1 br{display:none}.story .caption,.story p,.land-bottom{display:none}.scene{height:180%;top:-30%}.login-side{padding:24px 27px}.topline{font-size:10px}main{padding:38px 0 25px;max-width:420px}h2{font-size:26px}.intro{margin-bottom:25px}.eyebrow{display:none}.footer{padding-bottom:4px}.landscape .scene{opacity:.8}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
<section class="landscape" aria-label="穿行山野的高速公路与沿线广告牌插画">
<svg class="scene" viewBox="0 0 850 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#dbe3d3"/><stop offset="1" stop-color="#b9cbb9"/></linearGradient><linearGradient id="hill" x2=".7" y2="1"><stop stop-color="#789d85"/><stop offset="1" stop-color="#416d59"/></linearGradient><pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".5" fill="#fff" opacity=".12"/></pattern></defs>
<path fill="url(#sky)" d="M0 0h850v1000H0z"/><circle cx="681" cy="228" r="61" fill="#f4ebce" opacity=".78"/>
<path d="M0 535Q110 430 227 483T459 464T680 459T850 395V1000H0Z" fill="#a7bfa8"/>
<path d="M0 606Q137 467 313 564T579 525T850 504V1000H0Z" fill="#88a78e"/>
<path d="M0 665Q169 565 359 621T659 578T850 594V1000H0Z" fill="url(#hill)"/>
<path d="M532 516C444 565 478 603 563 647C691 711 693 771 494 846L214 1000H721L738 888C792 785 795 694 653 635C534 585 479 559 550 516Z" fill="#b7c7ac"/>
<path d="M537 516C454 567 496 607 582 650C709 716 711 779 521 855L276 1000H655L700 882C761 783 764 703 635 642C528 589 488 559 546 516Z" fill="#4d635a"/>
<path d="M542 519C475 563 509 605 608 651C736 717 739 784 610 870L470 1000" stroke="#d9ddc7" stroke-width="3" fill="none"/>
<path d="M540 519C470 567 513 610 598 652C727 715 723 780 582 867L424 1000" stroke="#c0c7ad" stroke-width="2" fill="none"/>
<path d="M539 520C464 568 503 605 589 650C714 713 716 775 550 860L351 1000M545 520C483 565 528 609 621 652C752 719 751 786 654 875L576 1000" stroke="#e3e4d1" stroke-width="2" stroke-dasharray="18 22" fill="none"/>
<path d="M0 841Q134 735 266 798T416 827L147 1000H0Z" fill="#315b49"/><path d="M850 787Q776 852 767 1000H850Z" fill="#345c49"/>
<g transform="translate(273 663)"><path d="M66 68v130l15-5V66" fill="#304e42"/><path d="M10 18L158 0v92L10 105Z" fill="#21463c"/><path d="M17 24L150 9v75L17 96Z" fill="#e8dcb6"/><path d="M17 77l133-15v22L17 96Z" fill="#d5b367"/><text x="34" y="58" fill="#315847" font-family="serif" font-size="22" letter-spacing="5" transform="rotate(-6 34 58)">一路向远</text><path d="M36 72l57-7" stroke="#6e8267" stroke-width="1"/></g>
<g transform="translate(631 570)"><path d="M25 24v50" stroke="#3a5e4a" stroke-width="5"/><path d="M0 4L53 0v30L0 34Z" fill="#e0d6ae"/><path d="M8 14l35-3m-35 11 24-2" stroke="#7b8e70" stroke-width="2"/></g>
<g transform="translate(636 755) rotate(15)"><rect width="12" height="25" rx="3" fill="#f5edcf"/><rect x="2" y="5" width="8" height="7" rx="1" fill="#63776e"/></g><g transform="translate(594 912) rotate(27)"><rect width="17" height="35" rx="4" fill="#d4b15f"/><rect x="2" y="6" width="13" height="9" rx="2" fill="#415e51"/></g>
<path fill="url(#grain)" d="M0 0h850v1000H0z"/>
</svg>
<div class="brand"><svg class="symbol" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M6 33 16 7h8l10 26M11 24h18" stroke="currentColor" stroke-width="2.5"/><path d="M20 12v6m0 7v8" stroke="currentColor" stroke-width="2"/></svg><div><div class="brand-name">沿途</div><small>公路资产 · 经营有序</small></div></div>
<div class="edition">经营管理平台</div>
<div class="story"><div class="caption">每一程，都有价值</div><h1>让沿途资源，<br>成为长久价值。</h1><p>连接每一块广告牌、每一份合约与每一笔收款。<br>在纵横路网之上，让经营心中有数。</p></div>
<div class="land-bottom"><div>路有远方，经营有章。<span>高速公路广告牌经营管理系统</span></div><div class="location">资源有据<br>经营有数</div></div>
</section>
<section class="login-side"><div class="topline"><span class="secure"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor"><path d="m10 2 6 3v5c0 4-6 7-6 7s-6-3-6-7V5Z"/><path d="m7 9 2 2 4-4"/></svg>内部业务平台 · 授权访问</span><span class="demo-tag">界面演示</span></div>
<main><div class="eyebrow">欢迎回到沿途</div><h2>开启有序的一天</h2><p class="intro">登录您的工作账号，查看沿线经营动态。</p><div class="tab">账号登录</div>
<form id="login" novalidate><label class="field-label" for="account">工作账号</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></svg><input id="account" name="username" autocomplete="username" placeholder="请输入您的账号" required maxlength="80"></div>
<label class="field-label" for="password">登录密码</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v3"/></svg><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button type="button" class="eye" id="eye" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<div class="options"><label class="remember"><input type="checkbox" id="remember">记住账号</label><button type="button" class="text-button" id="forgot">忘记密码？</button></div><button class="submit" type="submit" id="submit"><span>登录工作台</span><span aria-hidden="true">↗</span></button><div id="message" class="message" role="status" aria-live="polite"></div><p class="notice">账号由系统管理员统一分配。登录后，根据您的岗位<br>权限展示对应的业务功能与数据。</p></form>
</main><footer class="footer"><span>© 2026 沿途 · 高速公路广告牌经营管理系统</span><button id="help" type="button">使用帮助</button></footer></section>
</div><dialog id="dialog" aria-labelledby="dialog-title"><h3 id="dialog-title"></h3><p id="dialog-body"></p><button class="submit" id="close" type="button">我知道了</button></dialog>
<script>
const $=id=>document.getElementById(id);const dialog=$('dialog');function show(title,body){$('dialog-title').textContent=title;$('dialog-body').textContent=body;dialog.showModal()}$('close').onclick=()=>dialog.close();$('forgot').onclick=()=>show('联系管理员重置密码','请联系所在运营单位的系统管理员，提供您的工作账号及姓名，由管理员核实身份后重置密码。');$('help').onclick=()=>show('登录帮助','使用管理员分配的账号与密码登录。系统将根据岗位权限展示经营分析、档案管理或合同财务功能。当前页面为独立界面演示，尚未连接登录服务。');$('eye').onclick=()=>{const visible=$('password').type==='password';$('password').type=visible?'text':'password';$('eye').setAttribute('aria-label',visible?'隐藏密码':'显示密码');$('eye').setAttribute('aria-pressed',String(visible))};try{const saved=localStorage.getItem('yantu-account');if(saved){$('account').value=saved;$('remember').checked=true}}catch{}$('login').onsubmit=e=>{e.preventDefault();$('message').textContent='';for(const id of ['account','password']){const field=$(id);if(!field.value.trim()){field.setAttribute('aria-invalid','true');$('message').textContent=id==='account'?'请输入您的工作账号。':'请输入登录密码。';field.focus();return}field.removeAttribute('aria-invalid')}try{if($('remember').checked)localStorage.setItem('yantu-account',$('account').value.trim());else localStorage.removeItem('yantu-account')}catch{}show('登录界面已就绪','您的输入已通过非空检查。本页面为高保真交互演示，尚未连接账号认证服务，因此不会验证密码或进入业务系统。');};$('remember').onchange=()=>{if(!$('remember').checked)try{localStorage.removeItem('yantu-account')}catch{}};
</script></body></html>
