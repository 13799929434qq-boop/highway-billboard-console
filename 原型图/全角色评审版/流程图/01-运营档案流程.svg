<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#1769ed"/></marker></defs><rect width="1600" height="1080" fill="#f4f7fc"/><rect width="1600" height="150" fill="#102940"/><g font-family="Microsoft YaHei, sans-serif"><text x="70" y="80" font-size="40" font-weight="700" fill="white">运营档案业务流程</text><text x="70" y="120" font-size="21" fill="#bdd6f5">需求流程修订稿 · 2026-11-03 · 页面编号对应原型清单</text><rect x="70" y="190" width="680" height="185" rx="16" fill="white" stroke="#d4dfeb"/><circle cx="113" cy="235" r="23" fill="#1769ed"/><text x="113" y="243" text-anchor="middle" font-size="25" fill="white">1</text><text x="153" y="244" fill="#102940" font-size="29" font-weight="700">组织建档</text><text x="100" y="300" fill="#44566f" font-size="24">路段 → 地区 → 运营单位</text><text x="100" y="343" fill="#1769ed" font-size="21">O02</text><path d="M760,280 H830" stroke="#1769ed" stroke-width="3" marker-end="url(#a)"/><rect x="850" y="190" width="680" height="185" rx="16" fill="white" stroke="#d4dfeb"/><circle cx="893" cy="235" r="23" fill="#1769ed"/><text x="893" y="243" text-anchor="middle" font-size="25" fill="white">2</text><text x="933" y="244" fill="#102940" font-size="29" font-weight="700">资产建档</text><text x="880" y="300" fill="#44566f" font-size="24">三桩号 / 土地手续 / 照片</text><text x="880" y="343" fill="#1769ed" font-size="21">O03—O05</text><path d="M1540,280 H1550 V410 H40 V530 H60" fill="none" stroke="#1769ed" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="440" width="680" height="185" rx="16" fill="white" stroke="#d4dfeb"/><circle cx="113" cy="485" r="23" fill="#1769ed"/><text x="113" y="493" text-anchor="middle" font-size="25" fill="white">3</text><text x="153" y="494" fill="#102940" font-size="29" font-weight="700">证件维护</text><text x="100" y="550" fill="#44566f" font-size="24">路政批复 / 保险 / 年审及版本</text><text x="100" y="593" fill="#1769ed" font-size="21">O06</text><path d="M760,530 H830" stroke="#1769ed" stroke-width="3" marker-end="url(#a)"/><rect x="850" y="440" width="680" height="185" rx="16" fill="white" stroke="#d4dfeb"/><circle cx="893" cy="485" r="23" fill="#1769ed"/><text x="893" y="493" text-anchor="middle" font-size="25" fill="white">4</text><text x="933" y="494" fill="#102940" font-size="29" font-weight="700">变动前检查</text><text x="880" y="550" fill="#44566f" font-size="24">有有效合同：先处理合同影响</text><text x="880" y="593" fill="#1769ed" font-size="21">O07—O08</text><path d="M1540,530 H1550 V660 H40 V780 H60" fill="none" stroke="#1769ed" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="690" width="680" height="185" rx="16" fill="white" stroke="#d4dfeb"/><circle cx="113" cy="735" r="23" fill="#1769ed"/><text x="113" y="743" text-anchor="middle" font-size="25" fill="white">5</text><text x="153" y="744" fill="#102940" font-size="29" font-weight="700">变动登记</text><text x="100" y="800" fill="#44566f" font-size="24">移位 / 拆除；审批方式待确认</text><text x="100" y="843" fill="#1769ed" font-size="21">O07—O08</text><path d="M760,780 H830" stroke="#1769ed" stroke-width="3" marker-end="url(#a)"/><rect x="850" y="690" width="680" height="185" rx="16" fill="white" stroke="#d4dfeb"/><circle cx="893" cy="735" r="23" fill="#1769ed"/><text x="893" y="743" text-anchor="middle" font-size="25" fill="white">6</text><text x="933" y="744" fill="#102940" font-size="29" font-weight="700">留痕与追溯</text><text x="880" y="800" fill="#44566f" font-size="24">保留旧值、文件、合同和历史</text><text x="880" y="843" fill="#1769ed" font-size="21">O09</text><rect x="70" y="965" width="1460" height="76" rx="12" fill="#e6effc"/><text x="90" y="1010" font-size="21" fill="#29476c">删除为独立分支：只有无业务引用的错误或重复档案可申请删除；拆除不等于删除。</text></g></svg>
