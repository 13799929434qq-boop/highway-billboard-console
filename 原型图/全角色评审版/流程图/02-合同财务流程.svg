593" fill="#1769ed" font-size="21">F06</text><path d="M760,530 H830" stroke="#1769ed" stroke-width="3" marker-end="url(#a)"/><rect x="850" y="440" width="680" height="185" rx="16" fill="white" stroke="#d4dfeb"/><circle cx="893" cy="485" r="23" fill="#1769ed"/><text x="893" y="493" text-anchor="middle" font-size="25" fill="white">4</text><text x="933" y="494" fill="#102940" font-size="29" font-weight="700">合同生效与应收</text><text x="880" y="550" fill="#44566f" font-size="24">生成合同 × 广告牌 × 年度应收</text><text x="880" y="593" fill="#1769ed" font-size="21">F07—F09</text><path d="M1540,530 H1550 V660 H40 V780 H60" fill="none" stroke="#1769ed" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="690" width="680" height="185" rx="16" fill="white" stroke="#d4dfeb"/><circle cx="113" cy="735" r="23" fill="#1769ed"/><text x="113" y="743" text-anchor="middle" font-size="25" fill="white">5</text><text x="153" y="744" fill="#102940" font-size="29" font-weight="700">现金入账与分配</text><text x="100" y="800" fill="#44566f" font-size="24">先记收款 → 可待分配 → 核销应收</text><text x="100" y="843" fill="#1769ed" font-size="21">F10—F12</text><path d="M760,780 H830" stroke="#1769ed" stroke-width="3" marker-end="url(#a)"/><rect x="850" y="690" width="680" height="185" rx="16" fill="white" stroke="#d4dfeb"/><circle cx="893" cy="735" r="23" fill="#1769ed"/><text x="893" y="743" text-anchor="middle" font-size="25" fill="white">6</text><text x="933" y="744" fill="#102940" font-size="29" font-weight="700">独立台账与催收</text><text x="880" y="800" fill="#44566f" font-size="24">资金收支 / 发票 / 欠款导出</text><text x="880" y="843" fill="#1769ed" font-size="21">F13—F15</text><rect x="70" y="965" width="1460" height="76" rx="12" fill="#e6effc"/><text x="90" y="1010" font-size="21" fill="#29476c">校验失败返回草稿。合同变更/解除走F08影响核对，退款规则待确认；开票不自动核销应收。</text></g></svg>
