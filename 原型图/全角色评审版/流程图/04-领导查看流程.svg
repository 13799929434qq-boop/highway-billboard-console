593" fill="#1769ed" font-size="21">L02—L05</text><path d="M760,530 H830" stroke="#1769ed" stroke-width="3" marker-end="url(#a)"/><rect x="850" y="440" width="680" height="185" rx="16" fill="white" stroke="#d4dfeb"/><circle cx="893" cy="485" r="23" fill="#1769ed"/><text x="893" y="493" text-anchor="middle" font-size="25" fill="white">4</text><text x="933" y="494" fill="#102940" font-size="29" font-weight="700">只读下钻</text><text x="880" y="550" fill="#44566f" font-size="24">资产 / 合同 / 应收及收款关联</text><text x="880" y="593" fill="#1769ed" font-size="21">L06—L08</text><path d="M1540,530 H1550 V660 H40 V780 H60" fill="none" stroke="#1769ed" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="690" width="680" height="185" rx="16" fill="white" stroke="#d4dfeb"/><circle cx="113" cy="735" r="23" fill="#1769ed"/><text x="113" y="743" text-anchor="middle" font-size="25" fill="white">5</text><text x="153" y="744" fill="#102940" font-size="29" font-weight="700">核对统计口径</text><text x="100" y="800" fill="#44566f" font-size="24">到账日期与应收年度分别计算</text><text x="100" y="843" fill="#1769ed" font-size="21">L04—L05</text><path d="M760,780 H830" stroke="#1769ed" stroke-width="3" marker-end="url(#a)"/><rect x="850" y="690" width="680" height="185" rx="16" fill="white" stroke="#d4dfeb"/><circle cx="893" cy="735" r="23" fill="#1769ed"/><text x="893" y="743" text-anchor="middle" font-size="25" fill="white">6</text><text x="933" y="744" fill="#102940" font-size="29" font-weight="700">导出与返回</text><text x="880" y="800" fill="#44566f" font-size="24">Excel / PDF / 催收清单</text><text x="880" y="843" fill="#1769ed" font-size="21">保持筛选条件</text><rect x="70" y="965" width="1460" height="76" rx="12" fill="#e6effc"/><text x="90" y="1010" font-size="21" fill="#29476c">领导不录入、不审批、不登记收款、不核销；导出催收清单不等于发送通知。</text></g></svg>
